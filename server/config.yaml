# ===========================================
# VisionGuide Server - 服务端配置
# ===========================================

server:
  host: "0.0.0.0"           # 监听地址 (0.0.0.0 允许外部连接)
  port: 8765                # WebSocket 端口
  max_clients: 5            # 最大客户端数

processing:
  target_fps: 10            # 目标处理帧率
  jpeg_quality: 80          # JPEG 压缩质量 (1-100)
  max_frame_size: 1048576   # 最大帧大小 (1MB)

detection:
  model: "yolo26n.pt"
  confidence: 0.5
  device: "auto"
  alert_front_distance: 2.0   # 正前方触发报警的最大距离（米）
  alert_side_distance: 1.0    # 左/右侧触发报警的最大距离（米）

llm:
  # ── Live API 配置（首选，实时双向流）────────────────────────────────
  use_live: true                        # 启用 Gemini Live API
  live_model: "gemini-3.1-flash-live-preview"
  live_frame_interval: 1.5             # 每隔多少秒向 Live API 推一帧（秒）

  # ── 批量推理降级配置（Live 不可用时自动切换）────────────────────────
  use_llm: true
  provider: "gemma4"
  model: "gemma-4-26b-a4b-it"
  use_vision: false                    # Live 模式直接推帧，无需临时文件
  min_interval: 3.0

  # api_key: 从环境变量 GOOGLE_API_KEY 读取（已写入 .env）

ssl:
  # 与 HTTPS 服务器共用同一套证书（先运行 python mobile/start_https_server.py 生成）
  certfile: "mobile/_dev_cert.pem"
  keyfile:  "mobile/_dev_key.pem"

logging:
  level: "INFO"
