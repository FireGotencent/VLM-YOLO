# ===========================================
# VisionGuide Server - 服务端配置
# ===========================================

server:
  host: "0.0.0.0"           # 监听地址 (0.0.0.0 允许外部连接)
  port: 8765                # WebSocket 端口
  max_clients: 5            # 最大客户端数

processing:
  target_fps: 10            # 目标处理帧率
  jpeg_quality: 80          # JPEG 压缩质量 (1-100)
  max_frame_size: 1048576   # 最大帧大小 (1MB)

detection:
  model: "yolo26n.pt"
  confidence: 0.5
  device: "auto"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  base_url: "https://api.openai.com/v1"  # OpenAI 接口地址（也可填写兼容 OpenAI 的转发地址）
  use_llm: true             # 是否启用 LLM（启用前请先配置 OPENAI_API_KEY）
  min_interval: 2.0         # 服务端 LLM 播报最小间隔（秒）
  # api_key: 从环境变量 OPENAI_API_KEY 读取（建议写入 .env，不要提交）

ssl:
  # 与 HTTPS 服务器共用同一套证书（先运行 python mobile/start_https_server.py 生成）
  certfile: "mobile/_dev_cert.pem"
  keyfile:  "mobile/_dev_key.pem"

logging:
  level: "INFO"
